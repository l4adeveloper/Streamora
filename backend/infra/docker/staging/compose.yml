name: streamora-t01-stage

x-api-environment: &api-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 4000
  API_DOCS_ENABLED: "false"
  DATABASE_URL: postgresql://streamora:${T01_POSTGRES_PASSWORD:?Run staging:setup}@postgres:5432/streamora_staging
  ACCESS_TOKEN_SECRET: ${T01_ACCESS_TOKEN_SECRET:?Run staging:setup}
  WEB_ORIGIN: https://localhost:8443
  AUTH_COOKIE_SECURE: "true"
  AUTH_COOKIE_SAME_SITE: lax

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: streamora_staging
      POSTGRES_USER: streamora
      POSTGRES_PASSWORD: ${T01_POSTGRES_PASSWORD:?Run staging:setup}
    volumes:
      - stage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamora -d streamora_staging"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: streamora-t01-api:local
    build:
      context: ../../../..
      dockerfile: backend/infra/docker/staging/Dockerfile
      target: api
    environment: *api-environment
    command: ["npm", "run", "db:migrate", "--workspace=@streamora/api"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  api:
    image: streamora-t01-api:local
    build:
      context: ../../../..
      dockerfile: backend/infra/docker/staging/Dockerfile
      target: api
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: streamora-t01-web:local
    build:
      context: ../../../..
      dockerfile: backend/infra/docker/staging/Dockerfile
      target: web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  stage-postgres:
