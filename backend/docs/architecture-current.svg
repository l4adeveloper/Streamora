<text x="1356" y="1169" class="body">Bản ghi + file .md</text>
<text x="48" y="1255" class="body">Dữ liệu bền: PostgreSQL / DynamoDB / S3.  Chat trong cuộc họp vẫn nằm trong RAM của tiến trình API.</text>
<text x="48" y="1285" class="body">Tóm tắt chỉ chạy sau khi buổi học kết thúc, bản ghi đã lưu và transcript sẵn sàng; host bấm tạo yêu cầu.</text>
