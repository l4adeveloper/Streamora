<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1380" viewBox="0 0 1680 1380" role="img" aria-labelledby="title desc"><title id="title">Kiến trúc Streamora</title><desc id="desc">Frontend Next.js, backend NestJS và các luồng PostgreSQL, DynamoDB, Amazon IVS, S3, Azure Speech và Azure OpenAI.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#172554}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#64748b}.section{font-size:15px;font-weight:700;letter-spacing:1.5px}.head{font-size:21px;font-weight:650}.body{font-size:17px;fill:#334155}.tag{font-size:15px;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1680" height="1380" fill="#f8fafc"/>
