<text x="68" y="838" class="head">POSTGRESQL</text>
<text x="68" y="868" class="body">User / Group / Membership</text>
<text x="68" y="894" class="body">Session / Participation / Recording</text>
<text x="68" y="920" class="body">Folder / File metadata / Transcript</text>
<text x="68" y="946" class="body">Summary queue / video handoff</text>
<text x="68" y="972" class="body">Prisma + transaction + migration</text>
<rect x="451" y="804" width="375" height="225" rx="15" fill="#fffbeb" stroke="#fcd34d"/>
<text x="471" y="838" class="head">AWS / DỮ LIỆU</text>
<text x="471" y="868" class="body">DynamoDB: chat Workspace</text>
<text x="471" y="894" class="body">DynamoDB: video jobs ở AWS mode</text>
<text x="471" y="920" class="body">S3: tài liệu, HLS, MP4, Markdown</text>
<text x="471" y="946" class="body">Secrets Manager: Azure Socket.IO</text>
<text x="471" y="972" class="body">Local adapter: file trên ổ đĩa</text>
<rect x="854" y="804" width="375" height="225" rx="15" fill="#fffbeb" stroke="#fcd34d"/>
<text x="874" y="838" class="head">AWS / MEDIA</text>
<text x="874" y="868" class="body">IVS Stage + Composition</text>
<text x="874" y="894" class="body">Composition → S3 HLS recording</text>
<text x="874" y="920" class="body">MediaConvert → các chất lượng</text>
<text x="874" y="946" class="body">CloudFront → video playback</text>
<text x="874" y="972" class="body">SQS: đường sự kiện IVS tùy chọn</text>
<rect x="1257" y="804" width="375" height="225" rx="15" fill="#ecfeff" stroke="#67e8f9"/>
<text x="1277" y="838" class="head">AZURE</text>
<text x="1277" y="868" class="body">Web PubSub: transport Socket.IO</text>
<text x="1277" y="894" class="body">Speech: audio → transcript</text>
<text x="1277" y="920" class="body">OpenAI: transcript + tài liệu</text>
<text x="1277" y="946" class="body">→ nội dung tóm tắt có cấu trúc</text>
<text x="1277" y="972" class="body">Secrets chỉ thuộc backend</text>
