<text x="48" y="88" class="sub">Đối chiếu source 545b575 · 16/11/2026 · Dịch vụ cloud hoạt động khi được cấu hình; chưa kiểm kê hạ tầng live.</text>
<text x="48" y="130" class="section">01  GIAO DIỆN &amp; KẾT NỐI</text>
<rect x="48" y="151" width="490" height="155" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
<text x="68" y="185" class="head">NEXT.JS + REACT / 3000</text>
<text x="68" y="215" class="body">Workspace · Group · Thư viện · Account</text>
<text x="68" y="241" class="body">Standalone Meet + Workspace Meeting</text>
<text x="68" y="267" class="body">Dùng chung SessionRoom và IVS SDK</text>
<rect x="595" y="151" width="490" height="155" rx="15" fill="#eff6ff" stroke="#93c5fd"/>
<text x="615" y="185" class="head">TRÌNH DUYỆT</text>
<text x="615" y="215" class="body">REST: thao tác và quyền truy cập</text>
<text x="615" y="241" class="body">Socket.IO: chat, trạng thái, thông báo</text>
<text x="615" y="267" class="body">IVS SDK: mic, camera, màn hình</text>
<rect x="1142" y="151" width="490" height="155" rx="15" fill="#f0fdfa" stroke="#5eead4"/>
<text x="1162" y="185" class="head">MEDIA &amp; REALTIME</text>
<text x="1162" y="215" class="body">IVS: video/audio đi trực tiếp từ browser</text>
<text x="1162" y="241" class="body">Socket.IO local hoặc Azure Web PubSub</text>
<text x="1162" y="267" class="body">Upload part trực tiếp bằng URL đã ký</text>
